<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Academy | Eightplus Media</title>
    <meta
        name="description"
        content="Practical thinking for people who make communication matter. Executive learning, team workshops, and strategic frameworks."
    >
    <meta name="theme-color" content="#071b33">
    <link rel="stylesheet" href="./style.css">
    <style>
        :root {
            --brand-navy: #071b33;
            --brand-dark: #0f172a;
            --brand-accent: #0284c7;
            --brand-light-blue: #7dd3fc;
            --text-dark: #0f172a;
            --text-muted: #475569;
            --bg-light: #f8fafc;
            --border-color: #e2e8f0;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;
            color: var(--text-dark);
            background: #ffffff;
            line-height: 1.6;
            overflow-x: hidden;
        }
        img {
            display: block;
            max-width: 100%;
        }
        a {
            text-decoration: none;
        }
        button,
        input {
            font: inherit;
        }
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }
        /* =========================
           HERO
        ========================= */
        .page-hero {
            min-height: 520px;
            display: flex;
            align-items: center;
            padding: 110px 0 90px;
            background:
                linear-gradient(
                    90deg,
                    rgba(7, 27, 51, 0.95) 0%,
                    rgba(7, 27, 51, 0.86) 45%,
                    rgba(15, 23, 42, 0.62) 100%
                ),
                url('https://images.unsplash.com/photo-1524178232363-1fb2b075b655?auto=format&fit=crop&q=85&w=1800')
                center / cover no-repeat;
            color: #ffffff;
        }
        .hero-tagline {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            color: var(--brand-light-blue);
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.08em;
        }
        .hero-tagline::before {
            content: "";
            width: 30px;
            height: 1px;
            background: var(--brand-light-blue);
        }
        .page-title {
            font-size: clamp(2.8rem, 6vw, 4.6rem);
            font-weight: 500;
            line-height: 1.03;
            margin-bottom: 24px;
            letter-spacing: -0.045em;
            max-width: 900px;
        }
        .hero-description {
            font-size: 1.08rem;
            line-height: 1.75;
            color: #cbd5e1;
            max-width: 760px;
            margin-bottom: 36px;
        }
        .hero-cta-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        /* =========================
           SECTIONS
        ========================= */
        .academy-section {
            padding: 90px 0;
        }
        .section-alt {
            background: var(--bg-light);
        }
        .section-tag {
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.07em;
            color: var(--brand-accent);
            margin-bottom: 10px;
            display: block;
        }
        .section-title {
            font-size: clamp(2rem, 4vw, 2.7rem);
            font-weight: 500;
            margin-bottom: 15px;
            color: var(--brand-dark);
            letter-spacing: -0.035em;
            line-height: 1.1;
        }
        .section-lead {
            font-size: 1.03rem;
            color: var(--text-muted);
            max-width: 700px;
            margin-bottom: 44px;
            line-height: 1.7;
        }
        .text-center {
            text-align: center;
        }
        /* =========================
           PHILOSOPHY
        ========================= */
        .philosophy-section {
            padding: 70px 0 90px;
        }
        .belief-card {
            background:
                linear-gradient(
                    rgba(15, 23, 42, 0.91),
                    rgba(15, 23, 42, 0.96)
                ),
                url('https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?auto=format&fit=crop&q=85&w=1200')
                center / cover no-repeat;
            color: #ffffff;
            border-radius: 18px;
            padding: 56px;
            position: relative;
            z-index: 2;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .belief-card h2 {
            font-size: clamp(1.7rem, 3vw, 2.1rem);
            color: var(--brand-light-blue);
            margin-bottom: 18px;
            line-height: 1.25;
            font-weight: 600;
        }
        .belief-card p {
            color: #e2e8f0;
            font-size: 1rem;
            line-height: 1.75;
            max-width: 900px;
        }
        .belief-highlight {
            margin-top: 22px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff !important;
            font-weight: 600;
        }
        /* =========================
           GRIDS & CARDS
        ========================= */
        .grid {
            display: grid;
            gap: 28px;
        }
        .grid-2 {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .grid-3 {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }
        .grid-4 {
            grid-template-columns: repeat(4, minmax(0, 1fr));
        }
        .card {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition:
                transform 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                box-shadow 0.3s ease,
                border-color 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 35px -10px rgba(15, 23, 42, 0.1);
            border-color: #cbd5e1;
        }
        .card-img {
            width: 100%;
            height: 205px;
            object-fit: cover;
        }
        .card-content {
            padding: 30px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .badge {
            display: inline-block;
            padding: 4px 11px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            margin-bottom: 14px;
            width: fit-content;
        }
        .badge-active {
            background: #e0f2fe;
            color: #0369a1;
        }
        .badge-soon {
            background: #f1f5f9;
            color: #64748b;
        }
        .card-title {
            font-size: 1.3rem;
            font-weight: 650;
            color: var(--brand-dark);
            margin-bottom: 8px;
            line-height: 1.3;
        }
        .card-subtitle {
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--brand-accent);
            margin-bottom: 14px;
            line-height: 1.4;
        }
        .card-body {
            font-size: 0.93rem;
            color: var(--text-muted);
            line-height: 1.65;
            margin-bottom: 22px;
        }
        /* =========================
           LABS
        ========================= */
        .labs-intro {
            max-width: 720px;
        }
        .lab-card {
            border-top: 4px solid var(--brand-accent);
            padding: 0;
            overflow: hidden;
        }
        .lab-image {
            width: 100%;
            height: 210px;
            object-fit: cover;
        }
        .lab-content {
            padding: 28px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .lab-content .card-body {
            margin-bottom: 22px;
        }
        .outcome-box {
            background: var(--bg-light);
            border-left: 3px solid var(--brand-accent);
            padding: 14px 16px;
            border-radius: 0 8px 8px 0;
            font-size: 0.85rem;
            color: #334155;
            margin-top: auto;
        }
        .outcome-box strong {
            color: var(--brand-dark);
            margin-right: 4px;
        }
        /* =========================
           FREE RESOURCE
        ========================= */
        .resource-box {
            background:
                linear-gradient(
                    135deg,
                    var(--brand-navy) 0%,
                    var(--brand-dark) 100%
                );
            border-radius: 20px;
            overflow: hidden;
            color: #ffffff;
            display: grid;
            grid-template-columns: 0.95fr 1.05fr;
            box-shadow:
                0 25px 50px -12px rgba(7, 27, 51, 0.25);
        }
        .resource-image {
            position: relative;
            min-height: 480px;
            background:
                linear-gradient(
                    180deg,
                    rgba(7, 27, 51, 0.22) 0%,
                    rgba(7, 27, 51, 0.62) 100%
                ),
                url('Checklist.png')
                center / cover no-repeat;
        }
        .resource-image::after {
            content: "Free executive resource";
            position: absolute;
            left: 28px;
            bottom: 28px;
            padding: 9px 13px;
            background: rgba(7, 27, 51, 0.82);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #ffffff;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            backdrop-filter: blur(8px);
        }
        .resource-content {
            padding: 56px 48px 56px 40px;
        }
        .resource-content h3 {
            font-size: clamp(1.8rem, 4vw, 2.3rem);
            font-weight: 600;
            margin-bottom: 16px;
            color: #ffffff;
            line-height: 1.2;
            letter-spacing: -0.025em;
        }
        .resource-content p {
            color: #cbd5e1;
            font-size: 1rem;
            line-height: 1.7;
            margin-bottom: 22px;
        }
        .resource-checklist {
            font-size: 0.88rem !important;
            color: #94a3b8 !important;
            font-weight: 600;
        }
        .resource-form {
            margin-top: 30px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 28px;
            border-radius: 16px;
            backdrop-filter: blur(12px);
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 7px;
        }
        .form-input {
            width: 100%;
            padding: 13px 15px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #ffffff;
            font-size: 0.95rem;
        }
        .form-input::placeholder {
            color: #64748b;
        }
        .form-input:focus {
            outline: none;
            border-color: var(--brand-light-blue);
            box-shadow: 0 0 0 3px rgba(125, 211, 252, 0.1);
        }
        /* =========================
           INDUSTRY TAKEOVER
        ========================= */
        .takeover-banner {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            overflow: hidden;
            display: grid;
            grid-template-columns: 0.85fr 1.15fr;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.03);
        }
        .takeover-image {
            min-height: 330px;
            background:
                url('Sandi.jpg')
                center / cover no-repeat;
        }
        .takeover-text {
            padding: 48px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

            font-size: 1.65rem;
            font-weight: 650;
            color: var(--brand-dark);
            margin-bottom: 12px;
            line-height:
